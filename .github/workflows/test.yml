name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package dependencies
      run: |
        pip install -r package/requirements.txt --target package/lib

    - name: Install test dependencies
      run: |
        pip install -r tests/requirements.txt

    - name: Run tests
      env:
        ACCESS_TOKEN: test_token_for_ci
        PYTHONPATH: ${{ github.workspace }}/package/lib:${{ github.workspace }}/package:${{ github.workspace }}/package/server
      run: |
        pytest tests/ -v --tb=short

    - name: Run tests with coverage
      if: matrix.python-version == '3.10' && matrix.os == 'ubuntu-latest'
      run: |
        pytest tests/ --cov=package/server --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.10' && matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false